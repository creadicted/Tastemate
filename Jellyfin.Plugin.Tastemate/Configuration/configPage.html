<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tastemate</title>
</head>
<body>
    <div id="TastematePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <style>
            #TastematePage .tm-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1em; margin-bottom: 1.5em; }
            #TastematePage .tm-header h2 { margin: 0; }
            #TastematePage .tm-muted { opacity: .7; }
            #TastematePage .tm-actions { display: flex; flex-wrap: wrap; gap: .5em; }
            #TastematePage .tm-btn { cursor: pointer; border: 0; border-radius: .3em; padding: .55em 1.1em; font-size: inherit; color: inherit; background: rgba(255,255,255,.12); }
            #TastematePage .tm-btn:hover { background: rgba(255,255,255,.2); }
            #TastematePage .tm-btn.primary { background: #00a4dc; color: #fff; }
            #TastematePage .tm-btn.primary:hover { background: #33b6e3; }
            #TastematePage .tm-btn.danger:hover { background: #c0392b; }
            #TastematePage .tm-btn[disabled] { opacity: .4; cursor: default; }
            #TastematePage .tm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(18em, 1fr)); gap: 1em; }
            #TastematePage .tm-card { background: rgba(255,255,255,.06); border-radius: .5em; padding: 1.1em; display: flex; flex-direction: column; gap: .6em; }
            #TastematePage .tm-card h3 { margin: 0; }
            #TastematePage .tm-progress { height: .35em; border-radius: .2em; background: rgba(255,255,255,.12); overflow: hidden; }
            #TastematePage .tm-progress > div { height: 100%; background: #00a4dc; }
            #TastematePage .tm-empty { text-align: center; padding: 3em 1em; }
            #TastematePage .tm-slot { display: flex; align-items: center; gap: .8em; padding: .5em .8em; margin-bottom: .4em; border-radius: .4em; background: rgba(255,255,255,.06); min-height: 4.2em; }
            #TastematePage .tm-slot.empty { background: none; border: 1px dashed rgba(255,255,255,.2); }
            #TastematePage .tm-reason { width: 100%; margin-top: .3em; padding: .35em .6em; border: 0; border-bottom: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.05); color: inherit; font-size: .9em; box-sizing: border-box; }
            #TastematePage .tm-quote { font-style: italic; opacity: .8; font-size: .9em; white-space: normal; }
            #TastematePage .tm-rank { width: 2em; text-align: center; font-size: 1.3em; font-weight: bold; opacity: .8; }
            #TastematePage .tm-poster { width: 2.8em; height: 4.2em; object-fit: cover; border-radius: .2em; background: rgba(255,255,255,.1); flex: none; }
            #TastematePage .tm-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #TastematePage .tm-fill { display: grid; grid-template-columns: repeat(auto-fit, minmax(22em, 1fr)); gap: 2em; align-items: start; }
            #TastematePage .tm-sim { font-size: 2.4em; font-weight: bold; }
            #TastematePage .tm-cmp { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; }
            #TastematePage .tm-cmp th, #TastematePage .tm-cmp td { text-align: left; padding: .5em .6em; border-bottom: 1px solid rgba(255,255,255,.1); }
            #TastematePage .tm-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 2em; }
            #TastematePage .hide { display: none; }
        </style>
        <div data-role="content">
            <div class="content-primary">

                <!-- Lists -->
                <div id="TmListView">
                    <div class="tm-header">
                        <h2>Tastemate</h2>
                        <button type="button" class="tm-btn primary" id="TmNew">+ New list</button>
                    </div>
                    <div id="TmCards" class="tm-cards"></div>
                    <div id="TmNoLists" class="tm-empty tm-muted hide">No lists yet. Create one, e.g. "Top 10 Horror Movies".</div>

                    <!-- Seerr settings (administrators) -->
                    <form id="TmSeerr" class="tm-card hide" style="margin-top:2em;max-width:36em">
                        <h3>Seerr</h3>
                        <div class="tm-muted">Lets users request movies that are not in the library. Requests are made as the user's own Seerr account (matched by Jellyfin user). Leave the address empty to turn this off.</div>
                        <div id="TmSeerrNote" class="tm-muted hide"></div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmSeerrAddress">Seerr address (e.g. http://seerr:5055)</label>
                            <input id="TmSeerrAddress" type="text" is="emby-input" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmSeerrKey">API key</label>
                            <input id="TmSeerrKey" type="password" is="emby-input" autocomplete="off" />
                        </div>
                        <div><button type="submit" class="tm-btn primary">Save Seerr settings</button></div>
                    </form>
                </div>

                <!-- Create -->
                <div id="TmCreateView" class="hide">
                    <div class="tm-header">
                        <h2>New list</h2>
                        <button type="button" class="tm-btn" data-back>Cancel</button>
                    </div>
                    <form id="TmCreateForm">
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmTitle">Title (e.g. "Top 10 Horror Movies")</label>
                            <input id="TmTitle" type="text" is="emby-input" maxlength="100" required />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="TmSize">Number of entries</label>
                            <input id="TmSize" type="number" is="emby-input" min="1" max="25" value="10" required />
                        </div>
                        <button type="submit" class="tm-btn primary">Create list</button>
                    </form>
                </div>

                <!-- Fill out -->
                <div id="TmFillView" class="hide">
                    <div class="tm-header">
                        <div>
                            <h2 id="TmFillTitle"></h2>
                            <div class="tm-muted" id="TmFillSub"></div>
                        </div>
                        <div class="tm-actions">
                            <button type="button" class="tm-btn" data-back>Back</button>
                            <button type="button" class="tm-btn primary" id="TmSave">Save my list</button>
                        </div>
                    </div>
                    <div class="tm-fill">
                        <div>
                            <h3>My list</h3>
                            <div id="TmSlots"></div>
                        </div>
                        <div>
                            <h3>Add movies</h3>
                            <div class="inputContainer">
                                <label class="inputLabel inputLabelUnfocused" for="TmSearch">Search your library</label>
                                <input id="TmSearch" type="search" is="emby-input" />
                            </div>
                            <div id="TmResults"></div>
                        </div>
                    </div>
                </div>

                <!-- Compare -->
                <div id="TmCompareView" class="hide">
                    <div class="tm-header">
                        <div>
                            <h2 id="TmCmpTitle"></h2>
                            <div class="tm-muted" id="TmCmpSub"></div>
                        </div>
                        <button type="button" class="tm-btn" data-back>Back</button>
                    </div>
                    <div class="tm-actions" id="TmCmpUsers" style="margin-bottom:1.5em"></div>
                    <div id="TmCmpResult"></div>
                </div>

            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#TastematePage');
                var me = null;
                var state = { topics: [], rankers: {}, topic: null, entries: [], dirty: false, isAdmin: false, seerr: false, seerrStates: {} };
                var views = ['TmListView', 'TmCreateView', 'TmFillView', 'TmCompareView'];

                function $(id) { return page.querySelector(id); }
                function norm(id) { return String(id || '').replace(/-/g, '').toLowerCase(); }

                function api(method, path, body) {
                    var options = { type: method, url: ApiClient.getUrl('Tastemate/' + path) };
                    if (body !== undefined) {
                        options.data = JSON.stringify(body);
                        options.contentType = 'application/json';
                    }
                    if (method !== 'DELETE') { options.dataType = 'json'; }
                    return ApiClient.ajax(options);
                }

                function fail(response) {
                    Dashboard.hideLoadingMsg();
                    var done = function (text) { Dashboard.alert({ title: 'Tastemate', message: text || 'Request failed' }); };
                    if (response && response.text) { response.text().then(done); } else { done(); }
                }

                function el(tag, text, className) {
                    var node = document.createElement(tag);
                    if (text !== undefined && text !== null) { node.textContent = text; }
                    if (className) { node.className = className; }
                    return node;
                }

                function btn(label, onClick, className) {
                    var b = el('button', label, 'tm-btn' + (className ? ' ' + className : ''));
                    b.type = 'button';
                    b.addEventListener('click', onClick);
                    return b;
                }

                var EMPTY_ID = '00000000000000000000000000000000';
                function isLibrary(itemId) { return !!itemId && norm(itemId) !== EMPTY_ID; }

                // movie: { ItemId, Poster } - library items use the server image, TMDb movies their own poster
                function poster(movie) {
                    var img = el('img', undefined, 'tm-poster');
                    img.loading = 'lazy';
                    img.alt = '';
                    if (isLibrary(movie.ItemId)) {
                        img.src = ApiClient.getUrl('Items/' + movie.ItemId + '/Images/Primary', { maxHeight: 160, quality: 80 });
                    } else if (movie.Poster) {
                        img.src = movie.Poster;
                    }
                    img.addEventListener('error', function () { img.style.visibility = 'hidden'; });
                    return img;
                }

                // ---- Seerr ----
                var SEERR_LABELS = { pending: 'Requested', processing: 'Downloading', partial: 'Partly available', available: 'In Seerr: available' };
                var seerrControls = [];

                function applySeerr(control) {
                    var s = state.seerrStates[control.tmdbId];
                    var label = SEERR_LABELS[s];
                    control.button.textContent = label || 'Request in Seerr';
                    control.button.disabled = !!label;
                }

                function refreshSeerr() {
                    seerrControls = seerrControls.filter(function (c) { return c.button.isConnected; });
                    seerrControls.forEach(applySeerr);
                }

                // Movies outside the library get a request button once Seerr is configured
                function seerrControl(movie) {
                    if (!state.seerr || isLibrary(movie.ItemId) || !movie.TmdbId) { return null; }
                    var control = { tmdbId: movie.TmdbId };
                    control.button = btn('Request in Seerr', function () {
                        control.button.disabled = true;
                        api('POST', 'Seerr/Request', { TmdbId: movie.TmdbId }).then(function (r) {
                            Object.keys(r.States).forEach(function (id) { state.seerrStates[id] = r.States[id]; });
                            refreshSeerr();
                        }, function (response) { applySeerr(control); fail(response); });
                    });
                    seerrControls.push(control);
                    applySeerr(control);
                    return control.button;
                }

                function loadSeerrStates(movies) {
                    if (!state.seerr) { return; }
                    var ids = movies.filter(function (m) { return !isLibrary(m.ItemId) && m.TmdbId; }).map(function (m) { return m.TmdbId; });
                    if (!ids.length) { return; }
                    api('GET', 'Seerr/Status?tmdbIds=' + ids.slice(0, 25).join(',')).then(function (r) {
                        Object.keys(r.States).forEach(function (id) { state.seerrStates[id] = r.States[id]; });
                        refreshSeerr();
                    }, function () { /* keep the buttons as they are */ });
                }

                function loadSeerr() {
                    api('GET', 'Seerr/Status').then(function (r) { state.seerr = r.Enabled; }, function () { state.seerr = false; });
                    if (!state.isAdmin) { return; }
                    api('GET', 'Seerr/Settings').then(function (s) {
                        $('#TmSeerr').classList.remove('hide');
                        var inherited = s.Source === 'jellyfin-enhanced';
                        $('#TmSeerrAddress').value = inherited ? '' : s.Address;
                        $('#TmSeerrKey').value = '';
                        $('#TmSeerrKey').placeholder = s.HasApiKey && !inherited ? 'Saved. Leave empty to keep it.' : '';
                        var note = $('#TmSeerrNote');
                        note.classList.toggle('hide', !inherited && !s.EnhancedInstalled);
                        note.textContent = inherited ? 'Using the Seerr settings of Jellyfin Enhanced (' + s.Address + '). Fill in the fields below to use a different Seerr.'
                            : 'Jellyfin Enhanced is installed. Turn on its Seerr integration and Tastemate will use those settings, or enter them here.';
                    }, function () { /* not available */ });
                }

                $('#TmSeerr').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    api('PUT', 'Seerr/Settings', { Address: $('#TmSeerrAddress').value, ApiKey: $('#TmSeerrKey').value }).then(function (s) {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert({ title: 'Tastemate', message: s.Address ? 'Connected to Seerr. Settings saved.' : 'Seerr turned off.' });
                        loadSeerr();
                    }, fail);
                });

                function show(view) {
                    views.forEach(function (v) { $('#' + v).classList.toggle('hide', v !== view); });
                    window.scrollTo(0, 0);
                }

                function confirmDiscard() {
                    return !state.dirty || confirm('You have unsaved changes. Leave without saving?');
                }

                // ---- Lists view ----
                function loadLists() {
                    Dashboard.showLoadingMsg();
                    return api('GET', 'Topics').then(function (topics) {
                        state.topics = topics;
                        return Promise.all(topics.map(function (t) {
                            return api('GET', 'Topics/' + t.Id + '/Rankings').then(function (r) { state.rankers[t.Id] = r; }, function () { state.rankers[t.Id] = []; });
                        }));
                    }).then(function () {
                        renderLists();
                        Dashboard.hideLoadingMsg();
                    }, fail);
                }

                function myCount(topic) {
                    var mine = (state.rankers[topic.Id] || []).filter(function (r) { return norm(r.UserId) === me; })[0];
                    return mine ? mine.EntryCount : 0;
                }

                function renderLists() {
                    var cards = $('#TmCards');
                    cards.innerHTML = '';
                    $('#TmNoLists').classList.toggle('hide', state.topics.length > 0);
                    state.topics.forEach(function (t) {
                        var rankers = state.rankers[t.Id] || [];
                        var mine = myCount(t);
                        var others = rankers.filter(function (r) { return norm(r.UserId) !== me && r.EntryCount > 0; }).length;
                        var card = el('div', undefined, 'tm-card');
                        card.appendChild(el('h3', t.Title));
                        card.appendChild(el('div', 'Top ' + t.Size + ' · ' + rankers.length + (rankers.length === 1 ? ' person' : ' people') + ' ranked', 'tm-muted'));
                        var bar = el('div', undefined, 'tm-progress');
                        var fill = el('div');
                        fill.style.width = Math.min(100, Math.round(mine / t.Size * 100)) + '%';
                        bar.appendChild(fill);
                        card.appendChild(bar);
                        card.appendChild(el('div', mine ? 'Your list: ' + mine + ' / ' + t.Size : 'You have not filled this out yet', 'tm-muted'));
                        var actions = el('div', undefined, 'tm-actions');
                        actions.appendChild(btn(mine ? 'Edit my list' : 'Fill out', function () { openFill(t); }, 'primary'));
                        var compare = btn('Compare', function () { openCompare(t); });
                        if (!mine || !others) { compare.disabled = true; compare.title = !mine ? 'Fill out your list first' : 'Nobody else has ranked this yet'; }
                        actions.appendChild(compare);
                        if (norm(t.CreatedByUserId) === me || state.isAdmin) {
                            actions.appendChild(btn('Delete', function () { removeList(t); }, 'danger'));
                        }
                        card.appendChild(actions);
                        cards.appendChild(card);
                    });
                }

                function removeList(topic) {
                    if (!confirm('Delete "' + topic.Title + '" and everyone\'s rankings?')) { return; }
                    api('DELETE', 'Topics/' + topic.Id).then(loadLists, fail);
                }

                // ---- Create view ----
                $('#TmNew').addEventListener('click', function () { $('#TmTitle').value = ''; show('TmCreateView'); });

                $('#TmCreateForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    api('POST', 'Topics', { Title: $('#TmTitle').value, Size: parseInt($('#TmSize').value, 10) })
                        .then(function (topic) {
                            return loadLists().then(function () {
                                var created = state.topics.filter(function (t) { return t.Id === topic.Id; })[0] || topic;
                                openFill(created);
                            });
                        }, fail);
                });

                // ---- Fill out view ----
                function openFill(topic) {
                    state.topic = topic;
                    state.entries = [];
                    state.dirty = false;
                    $('#TmFillTitle').textContent = topic.Title;
                    $('#TmSearch').value = '';
                    $('#TmResults').innerHTML = '';
                    Dashboard.showLoadingMsg();
                    api('GET', 'Topics/' + topic.Id + '/Rankings/' + me).then(function (ranking) {
                        state.entries = ranking.Entries.map(function (e) {
                            return { ItemId: isLibrary(e.ItemId) ? e.ItemId : null, TmdbId: e.TmdbId, Name: e.Name, Year: e.Year, Poster: e.Poster, Reason: e.Reason || '' };
                        });
                    }, function () { /* no ranking yet */ }).then(function () {
                        renderSlots();
                        loadSeerrStates(state.entries);
                        show('TmFillView');
                        Dashboard.hideLoadingMsg();
                    });
                }

                function renderHeader() {
                    var size = state.topic.Size;
                    $('#TmFillSub').textContent = 'Top ' + size + ' · ' + state.entries.length + ' / ' + size + ' filled' + (state.dirty ? ' · unsaved changes' : '');
                }

                function renderSlots() {
                    var size = state.topic.Size;
                    renderHeader();
                    var slots = $('#TmSlots');
                    slots.innerHTML = '';
                    for (var i = 0; i < size; i++) {
                        (function (index) {
                            var entry = state.entries[index];
                            var row = el('div', undefined, 'tm-slot' + (entry ? '' : ' empty'));
                            row.appendChild(el('div', String(index + 1), 'tm-rank'));
                            if (entry) {
                                row.appendChild(poster(entry));
                                var info = el('div', undefined, 'tm-name');
                                info.style.whiteSpace = 'normal';
                                info.appendChild(el('div', entry.Name + (entry.Year ? ' (' + entry.Year + ')' : '') + (entry.ItemId ? '' : ' · not in library')));
                                var reason = el('input', undefined, 'tm-reason');
                                reason.type = 'text';
                                reason.maxLength = 280;
                                reason.placeholder = 'Why is this #' + (index + 1) + '? (optional)';
                                reason.value = entry.Reason || '';
                                reason.addEventListener('input', function () {
                                    entry.Reason = reason.value;
                                    if (!state.dirty) { state.dirty = true; renderHeader(); }
                                });
                                info.appendChild(reason);
                                var request = seerrControl(entry);
                                if (request) { info.appendChild(request); }
                                row.appendChild(info);
                                var up = btn('↑', function () { move(index, -1); });
                                var down = btn('↓', function () { move(index, 1); });
                                up.disabled = index === 0;
                                down.disabled = index === state.entries.length - 1;
                                up.title = 'Move up';
                                down.title = 'Move down';
                                row.appendChild(up);
                                row.appendChild(down);
                                var rm = btn('✕', function () { state.entries.splice(index, 1); touch(); }, 'danger');
                                rm.title = 'Remove';
                                row.appendChild(rm);
                            } else {
                                row.appendChild(el('div', 'Empty', 'tm-name tm-muted'));
                            }
                            slots.appendChild(row);
                        })(i);
                    }
                }

                function touch() { state.dirty = true; renderSlots(); }

                function move(index, delta) {
                    var target = index + delta;
                    if (target < 0 || target >= state.entries.length) { return; }
                    var tmp = state.entries[index];
                    state.entries[index] = state.entries[target];
                    state.entries[target] = tmp;
                    touch();
                }

                var searchTimer = null;
                $('#TmSearch').addEventListener('input', function () {
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(search, 250);
                });

                function inList(movie) {
                    return state.entries.some(function (e) {
                        if (movie.ItemId && e.ItemId) { return norm(e.ItemId) === norm(movie.ItemId); }
                        return !!movie.TmdbId && e.TmdbId === movie.TmdbId;
                    });
                }

                function addRow(container, movie, hint) {
                    var row = el('div', undefined, 'tm-slot');
                    row.appendChild(poster(movie));
                    var name = el('div', undefined, 'tm-name');
                    name.textContent = movie.Name + (movie.Year ? ' (' + movie.Year + ')' : '');
                    if (hint) { name.appendChild(el('div', hint, 'tm-muted')); }
                    row.appendChild(name);
                    var request = seerrControl(movie);
                    if (request) { row.appendChild(request); }
                    var add = btn(inList(movie) ? 'Added' : 'Add', function () {
                        if (state.entries.length >= state.topic.Size) {
                            Dashboard.alert({ title: 'Tastemate', message: 'Your list is full (' + state.topic.Size + '). Remove a movie first.' });
                            return;
                        }
                        state.entries.push(movie);
                        add.textContent = 'Added';
                        add.disabled = true;
                        touch();
                    }, 'primary');
                    add.disabled = inList(movie);
                    row.appendChild(add);
                    container.appendChild(row);
                }

                var searchSeq = 0;
                function search() {
                    var term = $('#TmSearch').value.trim();
                    var results = $('#TmResults');
                    var seq = ++searchSeq;
                    results.innerHTML = '';
                    if (!term) { return; }

                    var libraryBox = el('div');
                    libraryBox.appendChild(el('h4', 'In your library'));
                    var otherBox = el('div');
                    otherBox.appendChild(el('h4', 'Other movies (TMDb)'));
                    results.appendChild(libraryBox);
                    results.appendChild(otherBox);
                    libraryBox.appendChild(el('div', 'Searching...', 'tm-muted'));
                    otherBox.appendChild(el('div', 'Searching...', 'tm-muted'));

                    var library = ApiClient.getItems(me, {
                        IncludeItemTypes: 'Movie', Recursive: true, SearchTerm: term, Limit: 8, SortBy: 'SortName', Fields: 'ProviderIds'
                    }).then(function (result) {
                        return result.Items.map(function (item) {
                            return { ItemId: item.Id, TmdbId: (item.ProviderIds || {}).Tmdb || null, Name: item.Name, Year: item.ProductionYear || null, Poster: null };
                        });
                    }, function () { return []; });

                    var remote = api('GET', 'Search?query=' + encodeURIComponent(term)).then(function (found) {
                        return found.map(function (m) {
                            return { ItemId: null, TmdbId: m.TmdbId, Name: m.Name, Year: m.Year, Poster: m.Poster };
                        });
                    }, function () { return null; });

                    Promise.all([library, remote]).then(function (both) {
                        if (seq !== searchSeq) { return; }
                        var libraryMovies = both[0];
                        var remoteMovies = both[1];
                        libraryBox.innerHTML = '';
                        libraryBox.appendChild(el('h4', 'In your library'));
                        if (!libraryMovies.length) { libraryBox.appendChild(el('div', 'No matches in your library.', 'tm-muted')); }
                        libraryMovies.forEach(function (m) { addRow(libraryBox, m); });

                        otherBox.innerHTML = '';
                        otherBox.appendChild(el('h4', 'Other movies (TMDb)'));
                        if (remoteMovies === null) {
                            otherBox.appendChild(el('div', 'TMDb search is not available. Check that a TMDb metadata provider is enabled on the server.', 'tm-muted'));
                            return;
                        }
                        var inLibrary = {};
                        libraryMovies.forEach(function (m) { if (m.TmdbId) { inLibrary[m.TmdbId] = true; } });
                        var extra = remoteMovies.filter(function (m) { return !inLibrary[m.TmdbId]; });
                        if (!extra.length) { otherBox.appendChild(el('div', 'No other matches.', 'tm-muted')); }
                        extra.forEach(function (m) { addRow(otherBox, m, 'Not in your library'); });
                        loadSeerrStates(extra);
                    });
                }

                $('#TmSave').addEventListener('click', function () {
                    Dashboard.showLoadingMsg();
                    var entries = state.entries.map(function (e, i) {
                        var entry = { Rank: i + 1, TmdbId: e.TmdbId || null, Title: e.Name, Year: e.Year || null, Poster: e.Poster || null, Reason: (e.Reason || '').trim() || null };
                        if (e.ItemId) { entry.ItemId = e.ItemId; }
                        return entry;
                    });
                    api('PUT', 'Topics/' + state.topic.Id + '/Ranking', { Entries: entries }).then(function () {
                        state.dirty = false;
                        return loadLists();
                    }).then(function () { show('TmListView'); }, fail);
                });

                // ---- Compare view ----
                function openCompare(topic) {
                    state.topic = topic;
                    $('#TmCmpTitle').textContent = topic.Title;
                    $('#TmCmpSub').textContent = 'Pick someone to compare your list with';
                    $('#TmCmpResult').innerHTML = '';
                    var users = $('#TmCmpUsers');
                    users.innerHTML = '';
                    (state.rankers[topic.Id] || []).filter(function (r) { return norm(r.UserId) !== me && r.EntryCount > 0; }).forEach(function (r) {
                        users.appendChild(btn(r.UserName + ' (' + r.EntryCount + ')', function () { compare(r.UserId); }));
                    });
                    show('TmCompareView');
                }

                function compare(otherId) {
                    var out = $('#TmCmpResult');
                    out.innerHTML = '';
                    Dashboard.showLoadingMsg();
                    api('GET', 'Topics/' + state.topic.Id + '/Compare/' + otherId).then(function (r) {
                        Dashboard.hideLoadingMsg();
                        var res = r.Result;
                        $('#TmCmpSub').textContent = 'You vs ' + r.UserBName;
                        out.appendChild(el('div', res.Similarity + '% similar', 'tm-sim'));
                        out.appendChild(el('p', res.Shared.length + ' movie' + (res.Shared.length === 1 ? '' : 's') + ' in common', 'tm-muted'));

                        if (res.Shared.length) {
                            var table = el('table', undefined, 'tm-cmp');
                            var head = el('tr');
                            ['', 'Movie', 'You', r.UserBName, 'Gap'].forEach(function (h) { head.appendChild(el('th', h)); });
                            table.appendChild(head);
                            res.Shared.forEach(function (s) {
                                var row = el('tr');
                                var cell = el('td');
                                var movie = r.Movies[s.Key];
                                cell.appendChild(poster(movie));
                                row.appendChild(cell);
                                [[movie.Name + (movie.Year ? ' (' + movie.Year + ')' : ''), null],
                                    ['#' + s.RankA, s.ReasonA],
                                    ['#' + s.RankB, s.ReasonB],
                                    [s.Difference === 0 ? 'same' : String(s.Difference), null]].forEach(function (c) {
                                    var td = el('td', c[0]);
                                    if (c[1]) { td.appendChild(el('div', '\u201c' + c[1] + '\u201d', 'tm-quote')); }
                                    row.appendChild(td);
                                });
                                table.appendChild(row);
                            });
                            out.appendChild(table);
                        }

                        var cols = el('div', undefined, 'tm-cols');
                        [['Only on your list', res.OnlyInA], ['Only on ' + r.UserBName + '\'s list', res.OnlyInB]].forEach(function (group) {
                            var col = el('div');
                            col.appendChild(el('h3', group[0]));
                            if (!group[1].length) { col.appendChild(el('div', 'Nothing', 'tm-muted')); }
                            group[1].forEach(function (e) {
                                var row = el('div', undefined, 'tm-slot');
                                row.appendChild(el('div', String(e.Rank), 'tm-rank'));
                                var movie = r.Movies[e.Key];
                                row.appendChild(poster(movie));
                                var label = el('div', undefined, 'tm-name');
                                label.style.whiteSpace = 'normal';
                                label.appendChild(el('div', movie.Name + (movie.Year ? ' (' + movie.Year + ')' : '')));
                                if (e.Reason) { label.appendChild(el('div', '\u201c' + e.Reason + '\u201d', 'tm-quote')); }
                                row.appendChild(label);
                                col.appendChild(row);
                            });
                            cols.appendChild(col);
                        });
                        out.appendChild(cols);
                    }, fail);
                }

                // ---- Navigation ----
                page.querySelectorAll('[data-back]').forEach(function (b) {
                    b.addEventListener('click', function () {
                        if (!confirmDiscard()) { return; }
                        state.dirty = false;
                        show('TmListView');
                    });
                });

                page.addEventListener('pageshow', function () {
                    me = norm(ApiClient.getCurrentUserId());
                    show('TmListView');
                    ApiClient.getCurrentUser().then(function (user) {
                        state.isAdmin = !!(user && user.Policy && user.Policy.IsAdministrator);
                        loadSeerr();
                        return loadLists();
                    }, fail);
                });
            })();
        </script>
    </div>
</body>
</html>
