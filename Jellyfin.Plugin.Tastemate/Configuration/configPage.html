<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Top Lists</title>
</head>
<body>
    <div id="TastematePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select">
        <div data-role="content">
            <div class="content-primary">
                <h2>Top Lists</h2>

                <form id="TastemateCreateForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TcTitle">New topic (e.g. "Top 10 Horror Movies")</label>
                        <input id="TcTitle" type="text" is="emby-input" maxlength="100" required />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TcSize">Number of entries</label>
                        <input id="TcSize" type="number" is="emby-input" min="1" max="25" value="10" required />
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Create topic</span></button>
                </form>

                <div class="selectContainer">
                    <label class="selectLabel" for="TcTopic">Topic</label>
                    <select is="emby-select" id="TcTopic" class="emby-select-withcolor emby-select"></select>
                </div>
                <button is="emby-button" id="TcDelete" type="button" class="raised block emby-button hide"><span>Delete topic</span></button>

                <div id="TcEditor" class="hide">
                    <h3>My ranking</h3>
                    <ol id="TcMyList"></ol>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TcSearch">Search a movie to add</label>
                        <input id="TcSearch" type="search" is="emby-input" />
                    </div>
                    <ul id="TcResults"></ul>
                    <button is="emby-button" id="TcSave" type="button" class="raised button-submit block emby-button"><span>Save ranking</span></button>

                    <h3>Compare</h3>
                    <div class="selectContainer">
                        <label class="selectLabel" for="TcOther">Compare with</label>
                        <select is="emby-select" id="TcOther" class="emby-select-withcolor emby-select"></select>
                    </div>
                    <button is="emby-button" id="TcCompare" type="button" class="raised block emby-button"><span>Compare</span></button>
                    <div id="TcCompareResult"></div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#TastematePage');
                var state = { topics: [], topic: null, entries: [] };

                function $(id) { return page.querySelector(id); }

                function api(method, path, body) {
                    var options = { type: method, url: ApiClient.getUrl('Tastemate/' + path) };
                    if (body !== undefined) {
                        options.data = JSON.stringify(body);
                        options.contentType = 'application/json';
                    }
                    if (method !== 'DELETE') { options.dataType = 'json'; }
                    return ApiClient.ajax(options);
                }

                function fail(response) {
                    Dashboard.hideLoadingMsg();
                    var done = function (text) { Dashboard.alert({ title: 'Top Lists', message: text || 'Request failed' }); };
                    if (response && response.text) { response.text().then(done); } else { done(); }
                }

                function el(tag, text, className) {
                    var node = document.createElement(tag);
                    if (text !== undefined) { node.textContent = text; }
                    if (className) { node.className = className; }
                    return node;
                }

                function button(label, onClick) {
                    var b = el('button', label);
                    b.type = 'button';
                    b.addEventListener('click', onClick);
                    return b;
                }

                function loadTopics(selectId) {
                    return api('GET', 'Topics').then(function (topics) {
                        state.topics = topics;
                        var select = $('#TcTopic');
                        select.innerHTML = '';
                        topics.forEach(function (t) {
                            var option = el('option', t.Title + ' (Top ' + t.Size + ')');
                            option.value = t.Id;
                            select.appendChild(option);
                        });
                        if (selectId) { select.value = selectId; }
                        return selectTopic();
                    });
                }

                function selectTopic() {
                    var id = $('#TcTopic').value;
                    state.topic = state.topics.filter(function (t) { return t.Id === id; })[0] || null;
                    $('#TcEditor').classList.toggle('hide', !state.topic);
                    $('#TcDelete').classList.toggle('hide', !state.topic);
                    $('#TcCompareResult').innerHTML = '';
                    if (!state.topic) { return Promise.resolve(); }

                    state.entries = [];
                    var me = ApiClient.getCurrentUserId();
                    return api('GET', 'Topics/' + id + '/Rankings/' + me)
                        .then(function (ranking) {
                            state.entries = ranking.Entries.map(function (e) { return { ItemId: e.ItemId, Name: e.Name }; });
                        }, function () { /* no ranking yet */ })
                        .then(function () { renderList(); return loadRankers(); });
                }

                function loadRankers() {
                    var me = ApiClient.getCurrentUserId();
                    return api('GET', 'Topics/' + state.topic.Id + '/Rankings').then(function (rankers) {
                        var select = $('#TcOther');
                        select.innerHTML = '';
                        rankers.filter(function (r) { return r.UserId.replace(/-/g, '') !== me; }).forEach(function (r) {
                            var option = el('option', r.UserName + ' (' + r.EntryCount + ' movies)');
                            option.value = r.UserId;
                            select.appendChild(option);
                        });
                    });
                }

                function renderList() {
                    var list = $('#TcMyList');
                    list.innerHTML = '';
                    state.entries.forEach(function (entry, index) {
                        var li = el('li', entry.Name + ' ');
                        li.appendChild(button('Up', function () { move(index, -1); }));
                        li.appendChild(button('Down', function () { move(index, 1); }));
                        li.appendChild(button('Remove', function () { state.entries.splice(index, 1); renderList(); }));
                        list.appendChild(li);
                    });
                }

                function move(index, delta) {
                    var target = index + delta;
                    if (target < 0 || target >= state.entries.length) { return; }
                    var tmp = state.entries[index];
                    state.entries[index] = state.entries[target];
                    state.entries[target] = tmp;
                    renderList();
                }

                function search() {
                    var term = $('#TcSearch').value.trim();
                    var results = $('#TcResults');
                    results.innerHTML = '';
                    if (!term) { return; }
                    ApiClient.getItems(ApiClient.getCurrentUserId(), {
                        IncludeItemTypes: 'Movie', Recursive: true, SearchTerm: term, Limit: 10, SortBy: 'SortName'
                    }).then(function (result) {
                        result.Items.forEach(function (item) {
                            var li = el('li', item.Name + (item.ProductionYear ? ' (' + item.ProductionYear + ') ' : ' '));
                            li.appendChild(button('Add', function () {
                                if (state.entries.length >= state.topic.Size) {
                                    Dashboard.alert({ title: 'Top Lists', message: 'List is full (' + state.topic.Size + ').' });
                                } else if (!state.entries.some(function (e) { return e.ItemId === item.Id; })) {
                                    state.entries.push({ ItemId: item.Id, Name: item.Name });
                                    renderList();
                                }
                            }));
                            results.appendChild(li);
                        });
                    });
                }

                function save() {
                    Dashboard.showLoadingMsg();
                    var entries = state.entries.map(function (e, i) { return { Rank: i + 1, ItemId: e.ItemId }; });
                    api('PUT', 'Topics/' + state.topic.Id + '/Ranking', { Entries: entries }).then(function () {
                        return loadRankers();
                    }).then(function () { Dashboard.hideLoadingMsg(); }, fail);
                }

                function compare() {
                    var other = $('#TcOther').value;
                    var out = $('#TcCompareResult');
                    out.innerHTML = '';
                    if (!other) { return; }
                    api('GET', 'Topics/' + state.topic.Id + '/Compare/' + other).then(function (r) {
                        var res = r.Result;
                        out.appendChild(el('p', 'Similarity with ' + r.UserBName + ': ' + res.Similarity + '%'));
                        var table = el('table');
                        var head = el('tr');
                        ['Movie', r.UserAName, r.UserBName, 'Diff'].forEach(function (h) { head.appendChild(el('th', h)); });
                        table.appendChild(head);
                        res.Shared.forEach(function (s) {
                            var row = el('tr');
                            [r.Names[s.ItemId], '#' + s.RankA, '#' + s.RankB, s.Difference].forEach(function (c) { row.appendChild(el('td', String(c))); });
                            table.appendChild(row);
                        });
                        out.appendChild(table);
                        [['Only in ' + r.UserAName, res.OnlyInA], ['Only in ' + r.UserBName, res.OnlyInB]].forEach(function (group) {
                            out.appendChild(el('h4', group[0]));
                            var ul = el('ul');
                            group[1].forEach(function (e) { ul.appendChild(el('li', '#' + e.Rank + ' ' + r.Names[e.ItemId])); });
                            out.appendChild(ul);
                        });
                    }, fail);
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    loadTopics().then(function () { Dashboard.hideLoadingMsg(); }, fail);
                });

                $('#TastemateCreateForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    api('POST', 'Topics', { Title: $('#TcTitle').value, Size: parseInt($('#TcSize').value, 10) })
                        .then(function (topic) { $('#TcTitle').value = ''; return loadTopics(topic.Id); })
                        .then(function () { Dashboard.hideLoadingMsg(); }, fail);
                });

                $('#TcTopic').addEventListener('change', selectTopic);
                $('#TcSearch').addEventListener('input', search);
                $('#TcSave').addEventListener('click', save);
                $('#TcCompare').addEventListener('click', compare);
                $('#TcDelete').addEventListener('click', function () {
                    if (!confirm('Delete this topic and all rankings?')) { return; }
                    api('DELETE', 'Topics/' + state.topic.Id).then(function () { return loadTopics(); }, fail);
                });
            })();
        </script>
    </div>
</body>
</html>
